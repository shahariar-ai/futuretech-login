<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Your FutureTech.ai dashboard.">
  <meta name="theme-color" content="#0A0F1C">
  <meta name="robots" content="noindex">
  <title>FutureTech.ai — Dashboard</title>
  <script src="js/vt-guard.js"></script>

  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Sora typeface (free, Google Fonts). The page falls back to system fonts if offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/card.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<!-- is-guarding hides everything private until the session check passes -->
<body class="is-guarding">
  <a class="skip-link" href="#dash-card">Skip to your account</a>

  <!-- Decorative background layers -->
  <div class="ambient" aria-hidden="true"></div>
  <div class="particles" id="particles" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar__brand">
      <a class="brand" href="dashboard.html" aria-label="FutureTech.ai dashboard">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path d="M16 2.5l11.7 6.75v13.5L16 29.5 4.3 22.75V9.25z" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M16 9v5m0 4v5M10 12.5l4.3 2.5m3.4 2l4.3 2.5M22 12.5l-4.3 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="16" cy="16" r="2.4" fill="#FFB547"/>
        </svg>
        <span>FutureTech.ai</span>
      </a>

      <!-- Small desk lamp: stays lit while you're signed in -->
      <svg class="mini-lamp vt-lamp" id="mini-lamp" viewBox="0 0 72 60" role="img" aria-label="Desk lamp, light on" focusable="false">
        <defs>
          <linearGradient id="miniBeam" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFE0A3" stop-opacity=".55"/>
            <stop offset="1" stop-color="#FFB547" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="miniHalo">
            <stop offset="0" stop-color="#FFF4D6" stop-opacity=".95"/>
            <stop offset="1" stop-color="#FFB547" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <polygon class="mini-lamp__beam" points="44,24 56,24 72,60 30,60" fill="url(#miniBeam)"/>
        <ellipse cx="17" cy="56" rx="13" ry="3" fill="#2A3450"/>
        <rect x="15.5" y="18" width="3" height="37" rx="1.5" fill="#48557A"/>
        <rect x="16" y="15.5" width="28" height="3" rx="1.5" fill="#48557A" transform="rotate(-8 17 17)"/>
        <circle class="mini-lamp__halo" cx="50" cy="24" r="10" fill="url(#miniHalo)"/>
        <path d="M44 9h8l7 15q-11 3-22 0z" fill="#4C5A80"/>
        <circle class="mini-lamp__bulb" cx="50" cy="24" r="3.4"/>
        <circle cx="17" cy="17" r="3" fill="#252E45" stroke="#9C8A6E" stroke-width="1"/>
      </svg>
    </div>

    <div class="topbar__actions">
      <button type="button" class="install-btn" id="install-btn" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19.5h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Install app</span>
      </button>
      <span class="demo-badge" id="demo-badge" hidden>Demo mode<span class="demo-badge__more"> — no real authentication</span></span>
      <button type="button" class="btn-ghost btn-small signout-btn" id="signout-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 5H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h7M16 8l4 4-4 4M20 12H10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Sign out</span>
      </button>
    </div>
  </header>

  <main class="dash">
    <p class="dash__checking" id="dash-checking" role="status">Checking your session…</p>
    <noscript><p class="dash__noscript">The dashboard needs JavaScript. <a href="index.html">Back to sign in</a></p></noscript>

    <section class="card vt-card dash-card" id="dash-card" aria-labelledby="welcome-title" tabindex="-1">
      <div class="card__shade" aria-hidden="true"></div>
      <div class="card__light" aria-hidden="true"></div>
      <div class="card__noise" aria-hidden="true"></div>

      <div class="card__body">
        <div class="card__head">
          <span class="lock" id="lock" role="img" aria-label="Unlocked">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path class="lock__shackle" d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <rect x="5" y="11" width="14" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="12" cy="16" r="1.4" fill="currentColor"/>
            </svg>
          </span>
          <div>
            <h1 id="welcome-title" tabindex="-1">Welcome, <span id="welcome-name"></span></h1>
            <p class="card__sub">The light is on. You’re signed in.</p>
          </div>
        </div>

        <p class="form-message" id="dash-message" role="status" aria-live="polite"></p>

        <h2 class="dash__heading">Your account</h2>
        <dl class="details">
          <div class="details__row">
            <dt>Email</dt>
            <dd id="detail-email"></dd>
          </div>
          <div class="details__row">
            <dt>Member since</dt>
            <dd id="detail-created"></dd>
          </div>
          <div class="details__row">
            <dt>Email status</dt>
            <dd id="detail-confirmed"></dd>
          </div>
        </dl>

        <form class="profile-form" id="profile-form" novalidate>
          <h2 class="dash__heading">Profile</h2>
          <div class="field">
            <label for="profile-name">Full name</label>
            <div class="field__control">
              <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="12" cy="8.5" r="3.8" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path d="M4.5 20c1.2-3.6 4-5.4 7.5-5.4s6.3 1.8 7.5 5.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
              <input id="profile-name" name="name" type="text" autocomplete="name" autocapitalize="words" enterkeyhint="done" maxlength="100" required aria-describedby="profile-name-error">
            </div>
            <p class="field__error" id="profile-name-error"></p>
          </div>
          <p class="form-message" id="profile-message" role="status" aria-live="polite"></p>
          <button type="submit" class="btn-primary" id="profile-submit">
            <span class="btn__spinner" aria-hidden="true"></span>
            <span class="btn__label">Save changes</span>
          </button>
        </form>
      </div>
    </section>
  </main>

  <!-- Screen-reader announcements for lamp and auth state -->
  <p class="sr-only" id="sr-status" role="status" aria-live="polite" aria-atomic="true"></p>

  <footer class="footer">
    <p>© 2026 FutureTech.ai — Interactive UI Lab</p>
  </footer>

  <script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
